name: smartcall
description: "A Flutter dialer and voicemail app with smart calling features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0
  record: ^4.4.4
  permission_handler: ^11.4.3
  path_provider: ^2.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
